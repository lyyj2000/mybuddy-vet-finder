name: Nightly Vet Map Update

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: pip install openpyxl

      - name: 🗺️ Run build_map.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Safely replace the placeholder with the real key
          sed -i "s/PASTE_YOUR_NEW_API_KEY_HERE/$GOOGLE_API_KEY/" build_map.py
          # Run the script and show the output
          python build_map.py

      - name: 🚀 Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p dist
          cp index.html dist/
          cp manifest.json dist/
          cp icon.svg dist/
          npx wrangler@3 pages deploy dist --project-name=mybuddy-vet-finder --branch=main
